# Formats and lints the C++ and Python of the repository with the versions CI checks against.
# See docs/DEVELOPING.md.

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^src/
        exclude: ^src/external/
        types_or: [c++, objective-c++]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
