    test_cases:
      - name: transcribe-piano
        files:
          "Upload Solo Piano Audio": test_data/test_piano_20s.wav
        expect:
          "Transcription":
            min_notes: 20

  teamup-tech/U-DREAM:
    synthesized_inputs: *speech
    test_cases:
      - name: default
        expect:
          "Dereverberated Speech":
            min_duration: 7.8
            max_duration: 8.3
            min_rms_db: -45

  teamup-tech/UNISON:
    # Generate mode does not read the input audio. A prompt it can render
    # matters: the placeholder "test" once came back as silence.
    test_cases:
      - name: default
        controls:
          "Prompt": "rain falling on a tin roof"
          "Duration (s)": 5.0
        expect:
          "Generated Audio":
            min_duration: 4.5
            min_rms_db: -45

  teamup-tech/VampNet:
    test_cases:
      - name: default
        expect:
          "Generated Audio":
            min_duration: 7.8
            max_duration: 8.2
            min_rms_db: -45

  teamup-tech/Vevo2:
    # One case per Task, since each selects a different pipeline, with speech
    # as the voice to convert or edit and as the reference. The reference is
    # optional, which the harness leaves empty, so the tasks that need one are
    # given it.
    synthesized_inputs: *speech
    test_cases:
      - name: voice-conversion
        controls:
          "Task": "Voice/Singing Conversion"
        files:
          "Reference Voice": test_data/test_speech_10s.flac
        expect: &vevo2-voice
          "Generated Voice":
            min_duration: 1.5
            min_rms_db: -45

      - name: tts
        controls:
          "Task": "Text-to-Speech / Text-to-Singing"
          "Text / Lyrics": "The weather is lovely today, so we are going for a walk in the park."
        expect: *vevo2-voice

      - name: singing-editing
        controls:
          "Task": "Singing Editing"
          "Text / Lyrics": "The weather is lovely today."
        expect: *vevo2-voice

      - name: style-conversion
        controls:
          "Task": "Singing Style Conversion"
          "Text / Lyrics": "The weather is lovely today."
        files:
          "Reference Voice": test_data/test_speech_10s.flac
        expect: *vevo2-voice

      - name: melody-control
        controls:
          "Task": "Melody Control (Humming/Instrument to Singing)"
          "Text / Lyrics": "The weather is lovely today."
        files:
          "Reference Voice": test_data/test_speech_10s.flac
        expect: *vevo2-voice

  teamup-tech/VoiceCraft:
    # The speech asset's first words are "Every morning, the small bakery".
    # The default edit region, 0.5 to 1.5 seconds, is rewritten to a new word.
    synthesized_inputs: *speech
    test_cases:
      - name: default
        controls:
          "Target Transcript": "Every evening, the small bakery on the corner opens at seven. The smell of fresh bread drifts down the street."
        expect:
          "Edited Speech":
            min_duration: 4.0
            min_rms_db: -45

  teamup-tech/VoiceFixer:
    # The model returns speech about 26 dB quieter than it was given (measured
    # on clean speech), hence the lower floor.
    synthesized_inputs: *speech
    test_cases:
      - name: default
        expect:
          "Fixed Audio":
            min_duration: 7.8
            max_duration: 8.2
            min_rms_db: -60

  teamup-tech/Whisper:
    synthesized_inputs: *speech
    test_cases:
      - name: default
        expect:
          "Transcription":
            min_length: 40

  teamup-tech/Woosh-DFlow:
    test_cases:
      - name: default
        expect:
          "Generated audio":
            min_rms_db: -45

  teamup-tech/micro-TCN:
    test_cases:
      - name: default
        expect: *same-length

  teamup-tech/noisereduce:
    synthesized_inputs: *speech
    test_cases:
      - name: default
        expect: *same-length

  teamup-tech/text2midi:
    test_cases:
      - name: default
        controls:
          "Describe Your Music": "a cheerful pop song with piano, bass and drums"
        expect:
          "Generated MIDI":
