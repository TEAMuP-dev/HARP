# Configuration for model_validation/src/validate_models.py
#
# All keys are optional. Models not listed here are still discovered and
# validated automatically with a single synthesized "default" test case, so
# an entry is only needed to change a model's settings or add test cases.
#
# Model names here can refer to either tier. A bare "pitch_shifter" means the
# model in whichever tier is being run, which is the space on a spaces run and
# the local example on an examples run, since only one tier runs at a time.
# Qualify a name to pin it to one tier. "teamup-tech/pitch_shifter" (or
# "other-org/name") is only ever a space, and "examples/pitch_shifter" is only
# ever a local example.
#
# Schema:
#
#   synthesized_inputs:   # properties of the generated test inputs. Set here
#                         # as the global default, per model under `overrides`,
#                         # or per test case. Each level overrides the last.
#     audio:
#       sample_rate: 44100  # Hz
#       channels: 1         # 1 = mono, 2 = stereo
#       duration: 2.0       # seconds
#       ext: .wav           # format to write. Any format this libsndfile
#                           # build can write is accepted, and one it cannot
#                           # write is reported as a configuration error. A
#                           # component that accepts only other extensions
#                           # still gets one it accepts
#     midi:
#       num_notes: 2        # ascending notes from middle C
#       note_duration: 0.5  # seconds per note
#       ext: .mid
#
#   exclude:        # models to exclude from validation
#     - some-non-harp-space
#     - other-org/some-space
#     - examples/some_example
#
#   include_extra:  # spaces outside the org that should also be validated
#     - some-user/some-harp-space
#
#   overrides:      # per-model settings. Keys are model names (bare or
#                   # owner-qualified), or "examples/<example-dir>"
#     <model key>:
#       connect_timeout: 600   # seconds to wait for build/wake (default 420)
#       process_timeout: 900   # seconds to wait for /process (default 600)
#       load_only: true        # only check availability + /controls
#
#       synthesized_inputs:    # input properties for this model's cases
#         audio:
#           sample_rate: 48000
#           channels: 2
#
#       test_cases:            # named /process test cases. When omitted, a
#                              # single synthesized "default" case runs
#         - name: default      # empty case == synthesized defaults
#
#         - name: my-case
#           process_timeout: 300   # optional per-case override
#
#           controls:              # override control values by label
#             "Some Slider Label": 12
#             "Some Toggle Label": true
#
#           files:                 # override track/file inputs by label.
#                                  # Paths are relative to this file
#             "Input Audio": test_data/my_clip.wav
#
#           synthesized_inputs:    # input properties for this case only
#             audio:
#               duration: 10.0
#
#           expect:                # per-output checks, keyed by output label.
#                                  # "*" applies rules to every compatible
#                                  # output (see the rule table below)
#             "Output Audio":
#               ext: .wav          # extension: string or list of accepted
#               min_bytes: 1000    # minimum file size, in bytes
#               channels: 1        # audio: exact channel count
#               sample_rate: 44100 # audio: exact sample rate, in Hz
#               min_duration: 1.5  # audio/MIDI: minimum length, in seconds
#               max_duration: 10.0 # audio/MIDI: maximum length, in seconds
#               bit_depth: 16      # audio: exact PCM bit depth (PCM formats)
#               min_rms_db: -60    # audio: minimum RMS level, in dBFS
#             "Output MIDI":
#               min_notes: 1       # MIDI: minimum note-on count
#             "Output Labels":
#               min_labels: 1      # LabelList: minimum count. 0 permits an
#                                  # empty list, but still requires a valid one
#
#           validators:            # only for checks `expect` cannot express,
#                                  # such as ones spanning several outputs.
#                                  # Each validator's parameters nest under it
#             labels_within_audio:
#               tolerance: 0.1
#
#       skip_common_cases: true    # opt this model out of common_test_cases
#
#   common_test_cases:   # generic cases run on EVERY model, on top of its
#                        # own. Keep them model-agnostic by targeting outputs
#                        # with "*" rather than a label
#     - name: outputs-nontrivial
#       expect:
#         "*":
#           min_bytes: 100   # every file output is at least minimally sized
#
# Which expect rules apply to which output types:
#
#   ext, min_bytes                                  any file output
#   channels, sample_rate, bit_depth, min_rms_db    audio outputs
#   min_duration, max_duration                      audio and MIDI outputs
#   min_notes                                       MIDI outputs
#   min_labels                                      JSON (LabelList) outputs
#
# Applying a rule to a NAMED output whose type it does not cover fails the
# case with a message naming the configuration mistake, rather than reading as
# a fault in the model. Under "*" such a rule is skipped instead, which is what
# lets a common case target types a model may not have. Audio outputs are
# decoded with soundfile, so any libsndfile format works (WAV, FLAC, OGG, MP3,
# AIFF, ...). Note that bit_depth applies only to PCM formats, not compressed
# ones. MIDI outputs are parsed with mido.

exclude: []

include_extra: []

overrides:

  # ---- Local pyharp examples ----------------------------------------------
  # These run with `--local-examples` and exercise pyharp itself with no
  # Hugging Face infrastructure involved. A failure here indicates a
  # pyharp/gradio-level breakage rather than a deployment-specific one.
  # Examples are discovered automatically, so entries are only needed to add
  # test cases beyond the synthesized default.

  examples/pitch_shifter:
    test_cases:
      - name: default
      - name: shift-up-octave
        controls:
          "Pitch Shift (semitones)": 12
        expect:
          "Output Audio":
            ext: .wav
            min_rms_db: -60      # shifted audio must still carry signal
      - name: shift-down-octave
        controls:
          "Pitch Shift (semitones)": -12
      - name: no-shift
        controls:
          "Pitch Shift (semitones)": 0

  examples/midi_pitch_shifter:
    test_cases:
      - name: default
      - name: shift-up-max
        controls:
          "Pitch Shift (semitones)": 24
        expect:
          "Output Midi":
            min_notes: 1         # shifted MIDI must still contain notes
      - name: shift-down-max
        controls:
          "Pitch Shift (semitones)": -24

  # ---- Remote space overrides ---------------------------------------------
  # Add per-space timeouts and extra test cases here as needed, e.g.:
  #
  # teamup-tech/pitch_shifter:
  #   process_timeout: 900
  #   test_cases:
  #     - name: default
  #     - name: extreme-shift
  #       controls:
  #         "Pitch Shift (semitones)": 24
  #       expect:
  #         "Output Audio":
  #           ext: .wav
  #           min_bytes: 10000
  #           channels: 1
  #           sample_rate: 44100
  #           min_duration: 1.5
